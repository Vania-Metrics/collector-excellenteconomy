# What the test server needs besides the core; read by the core's testkit (CollectorTestConfig).
# The first jar of a list is the target plugin: its version is checked against compatibility.yml.
# ExcellentEconomy 2.8.0 is compiled for Java 25, needs nightcore, and fails to enable without
# Vault's classes although it only soft-depends on it: VaultUnlocked provides them.
collectors: [economy]
runtime: java25
plugins:
  bukkit:
