# Economy metrics - the MOVEMENT, not the total.
#
# The total in circulation comes from the essentials module, which reads
# EssentialsX's already-computed cache. This one listens to ChangeBalanceEvent
# and reports who earns, who spends, how much, and in which currency. No
# database reads.
name: VaniaMetrics-Economy
version: ${version}
main: fr.samflix.vaniametrics.module.excellenteconomy.EconomyPaper
api-version: '1.21'
authors: [mc-vania]
description: "ExcellentEconomy metrics: transactions, flow, balances."
depend: [VaniaMetrics, ExcellentEconomy]
